<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Carteira de Habilitação Interna - CHI - Enaex Brasil</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
  <link rel="icon" href="assets/chi-page-logo.png" type="image/png">
</head>
<body>
  <header class="topbar"><div class="brand"><img src="assets/chi-page-logo.png" alt="Logo CHI Enaex Brasil"></div><strong>Carteira de Habilitação Interna - CHI - Enaex Brasil</strong><span aria-hidden="true"></span></header>
  <main>
    <section class="toolbar" aria-label="Localizar colaborador">
      <label for="registro">NOME OU REGISTRO</label>
      <div class="searchline"><input id="registro" type="search" list="staff-suggestions" autocomplete="off" placeholder="Digite o nome ou o registro"><datalist id="staff-suggestions"></datalist><button id="search" class="primary">Buscar</button><button id="sheet-open" class="outline" type="button" disabled>Ver planilha</button><button id="fill-sheet" class="outline" type="button">Preencher Planilha</button><button id="refresh" class="sync" title="Atualizar dados da planilha" aria-label="Atualizar dados">↻</button></div>
      <small id="source-status" class="visually-hidden" role="status" aria-live="polite">Conectando à planilha…</small>
    </section>

    <section id="result" class="result" hidden>
      <div class="personline"><div><span id="employee-id" class="eyebrow"></span><h1 id="employee-name"></h1><p id="employee-role"></p></div><div class="actions"><label class="upload">Foto <input id="photo" type="file" accept="image/*" hidden></label><button id="pdf" class="primary" disabled>Baixar PDF</button><button id="png" class="outline" disabled>Baixar PNG</button></div></div>
      <div class="cards"><article class="badge" id="front-card" aria-label="Frente do crachá"></article><article class="badge" id="back-card" aria-label="Verso do crachá"></article></div>
      <div class="sides"><span>Frente</span><span>Verso</span></div>
    </section>
    <div id="empty" class="empty">Digite o nome ou o registro do colaborador.</div>
    <div id="error" class="error" role="alert" hidden></div>
  </main>
  <dialog id="sheet-auth-dialog" class="sheet-auth-dialog" aria-labelledby="sheet-auth-title">
    <form id="sheet-auth-form">
      <div class="sheet-head">
        <h2 id="sheet-auth-title">Acesso para preencher a planilha</h2>
        <button id="sheet-auth-close" class="close-sheet" type="button" aria-label="Fechar">×</button>
      </div>
      <label class="sheet-auth-label" for="sheet-password">Senha</label>
      <input id="sheet-password" class="sheet-auth-input" type="password" autocomplete="off" required>
      <p id="sheet-auth-error" class="sheet-auth-error" role="alert" hidden>Senha incorreta.</p>
      <div class="sheet-auth-actions">
        <button id="sheet-auth-cancel" class="outline" type="button">Cancelar</button>
        <button class="primary" type="submit">Acessar planilha</button>
      </div>
    </form>
  </dialog>
  <dialog id="sheet-dialog" class="sheet-dialog" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">Planilha</h2>
      <button id="sheet-close" class="close-sheet" type="button" aria-label="Fechar">×</button>
    </div>
    <div class="sheet-controls">
      <div class="sheet-tabs" role="tablist" aria-label="Abas da planilha">
        <button id="sheet-tab-matrix" class="sheet-tab" type="button" role="tab" aria-selected="true">Matriz</button>
        <button id="sheet-tab-training" class="sheet-tab" type="button" role="tab" aria-selected="false">Treinamentos</button>
      </div>
      <input id="sheet-filter" type="search" placeholder="Filtrar linhas" aria-label="Filtrar linhas">
      <span id="sheet-count" role="status"></span>
    </div>
    <div id="sheet-content" class="sheet-content" role="tabpanel" tabindex="0"></div>
  </dialog>
  <footer><i></i> HUB OPERACIONAL OPENBLAST</footer>
</body>
</html>
