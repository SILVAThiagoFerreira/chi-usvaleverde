name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/configure-pages@v6.0.0
      - name: Prepare site files
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js _site/
          cp assets/* _site/assets/
          sed -i "s|app.js|app.js?v=${GITHUB_SHA}|; s|styles.css|styles.css?v=${GITHUB_SHA}|" _site/index.html
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
